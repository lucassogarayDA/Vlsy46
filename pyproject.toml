[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlsy46"
version = "2.0.0"
description = "Catálogo interactivo de paquetes para Termux con AutoSync y Package Runner"
readme = "README.md"
authors = [{ name = "Lucas Sogaray" }]
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Operating System :: Android",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
vlsy46 = "vlsy46.Vlsy46:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vlsy46*"]

[tool.setuptools.package-data]
vlsy46 = ["catalogo.json"]
